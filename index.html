<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8" />
  <meta name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>黎明原野 Dawnfield</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --gold: #e9c77b;
      --gold-soft: rgba(233, 199, 123, .5);
      --gold-faint: rgba(233, 199, 123, .18);
      --panel-a: rgba(34, 50, 116, .74);
      --panel-b: rgba(10, 16, 46, .78);
      --text: #f7f2e4;
      --text-dim: #cfc7b1;
      --serif: "Noto Serif TC", "Songti TC", serif;
      --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #9fc6e8;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      font-family: var(--sans);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    canvas {
      display: block;
      touch-action: none;
    }

    .panel {
      position: fixed;
      pointer-events: none;
      background: linear-gradient(160deg, var(--panel-a), var(--panel-b));
      -webkit-backdrop-filter: blur(10px) saturate(1.25);
      backdrop-filter: blur(10px) saturate(1.25);
      border: 1px solid var(--gold-soft);
      border-radius: 12px;
      box-shadow: 0 12px 32px rgba(5, 10, 30, .35), inset 0 1px 0 rgba(255, 255, 255, .14);
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 4px;
      border-radius: 9px;
      border: 1px solid var(--gold-faint);
      pointer-events: none;
    }

    /* 開場地名橫幅 */
    #banner {
      position: fixed;
      top: 10vh;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
      white-space: nowrap;
      text-shadow: 0 2px 12px rgba(10, 20, 60, .55), 0 0 2px rgba(10, 20, 60, .6);
      transition: opacity 1.4s ease, transform 1.4s ease;
    }

    #banner .chapter {
      font: 600 13px var(--serif);
      letter-spacing: .5em;
      color: var(--gold);
      opacity: 0;
      animation: fadeUp 1s .5s forwards;
    }

    #banner .name {
      font: 900 clamp(34px, 7vw, 60px)/1.15 var(--serif);
      letter-spacing: .32em;
      margin: 6px 0 4px .32em;
      color: #fff;
      filter: drop-shadow(0 3px 10px rgba(10, 20, 60, .5));
      animation: nameIn 1.6s .8s both cubic-bezier(.2, .7, .2, 1);
    }

    #banner .orn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      opacity: 0;
      animation: fadeUp 1s 1.6s forwards;
    }

    #banner .orn::before,
    #banner .orn::after {
      content: "";
      width: 72px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold));
    }

    #banner .orn::after {
      transform: scaleX(-1);
    }

    #banner .orn span {
      font: 500 11px var(--sans);
      letter-spacing: .6em;
      margin-right: -.6em;
      color: var(--text-dim);
    }

    #banner.hide {
      opacity: 0;
      transform: translate(-50%, -12px);
    }

    @keyframes nameIn {
      from {
        opacity: 0;
        letter-spacing: .7em;
        filter: blur(8px);
      }

      to {
        opacity: 1;
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    /* 左上角地點 */
    #loc {
      top: 16px;
      left: 16px;
      padding: 10px 18px 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity .8s, transform .8s;
    }

    #loc.show {
      opacity: 1;
      transform: none;
    }

    #loc .gem {
      width: 12px;
      height: 12px;
      transform: rotate(45deg);
      background: linear-gradient(135deg, #fff1c4, var(--gold) 55%, #9a7330);
      box-shadow: 0 0 10px rgba(233, 199, 123, .7);
    }

    #loc .t {
      font: 700 15px var(--serif);
      letter-spacing: .25em;
    }

    #loc .s {
      font: 500 9px var(--sans);
      letter-spacing: .4em;
      color: var(--text-dim);
      margin-top: 1px;
    }

    /* 操作說明 */
    #help {
      bottom: 16px;
      right: 16px;
      padding: 12px 16px;
      font-size: 12px;
      color: var(--text-dim);
      max-width: calc(100vw - 32px);
    }

    #help .row {
      display: flex;
      align-items: center;
      gap: 8px;
      line-height: 1;
    }

    #help .row+.row {
      margin-top: 8px;
    }

    #help .lab {
      margin-left: 2px;
      min-width: 52px;
      color: var(--text);
    }

    kbd {
      display: inline-grid;
      place-items: center;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border-radius: 5px;
      font: 700 10.5px var(--sans);
      color: #2b2214;
      background: linear-gradient(180deg, #fffaf0, #dccfae);
      box-shadow: 0 2px 0 #8c7a52, 0 3px 6px rgba(0, 0, 0, .3);
    }

    .touch-only {
      display: none;
    }

    body.touch .touch-only {
      display: block;
    }

    body.touch .desk-only {
      display: none;
    }

    body.touch #help {
      top: 16px;
      bottom: auto;
      padding: 8px 12px;
      font-size: 11px;
      max-width: 46vw;
      line-height: 1.5;
    }

    #vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 58%, rgba(10, 15, 40, .34) 100%);
    }

    /* 虛擬搖桿 */
    #joy {
      position: fixed;
      left: max(24px, env(safe-area-inset-left));
      bottom: max(32px, env(safe-area-inset-bottom));
      width: 148px;
      height: 148px;
      border-radius: 50%;
      display: none;
      z-index: 5;
      touch-action: none;
      background: radial-gradient(circle, rgba(20, 30, 80, .15) 40%, rgba(20, 30, 80, .45));
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      border: 1px solid var(--gold-soft);
      box-shadow: 0 8px 24px rgba(5, 10, 30, .3), inset 0 0 0 6px rgba(255, 255, 255, .04);
    }

    #joy::before {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      border: 1px dashed var(--gold-faint);
    }

    #joy::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        conic-gradient(from -4deg, var(--gold) 0 8deg, transparent 8deg 90deg, var(--gold) 90deg 98deg, transparent 98deg 180deg,
          var(--gold) 180deg 188deg, transparent 188deg 270deg, var(--gold) 270deg 278deg, transparent 278deg);
      -webkit-mask: radial-gradient(circle, transparent 66px, #000 67px 70px, transparent 71px);
      mask: radial-gradient(circle, transparent 66px, #000 67px 70px, transparent 71px);
      opacity: .7;
    }

    #knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      z-index: 1;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle at 36% 30%, #fffaf0, #f0d898 45%, #b78d45 100%);
      box-shadow: 0 6px 16px rgba(0, 0, 0, .4), inset 0 -3px 6px rgba(90, 60, 20, .45), inset 0 2px 3px rgba(255, 255, 255, .8);
    }

    #knob::after {
      content: "";
      position: absolute;
      inset: 18px;
      border-radius: 50%;
      border: 1px solid rgba(120, 85, 30, .35);
    }

    #jumpBtn,
    #atkBtn {
      position: fixed;
      right: max(28px, env(safe-area-inset-right));
      bottom: max(48px, env(safe-area-inset-bottom));
      width: 88px;
      height: 88px;
      border-radius: 50%;
      display: none;
      z-index: 5;
      touch-action: none;
      border: 1px solid var(--gold-soft);
      color: var(--text);
      background: radial-gradient(circle at 50% 35%, rgba(58, 82, 180, .85), rgba(12, 18, 52, .88));
      box-shadow: 0 8px 22px rgba(5, 10, 30, .35), inset 0 0 0 5px rgba(233, 199, 123, .12), inset 0 1px 0 rgba(255, 255, 255, .2);
      transition: transform .08s, filter .08s;
    }

    #jumpBtn b,
    #atkBtn b {
      display: block;
      font: 900 26px/1 var(--serif);
      color: var(--gold);
    }

    #jumpBtn small,
    #atkBtn small {
      display: block;
      font: 600 9px var(--sans);
      letter-spacing: .3em;
      margin: 4px -.3em 0 0;
      color: var(--text-dim);
    }

    #atkBtn {
      right: calc(max(28px, env(safe-area-inset-right)) + 100px);
      bottom: max(28px, env(safe-area-inset-bottom));
      width: 76px;
      height: 76px;
      background: radial-gradient(circle at 50% 35%, rgba(180, 60, 50, .85), rgba(52, 14, 18, .88));
    }

    #jumpBtn:active,
    #atkBtn:active {
      transform: scale(.94);
      filter: brightness(1.25);
    }

    body.touch #joy,
    body.touch #jumpBtn,
    body.touch #atkBtn {
      display: block;
    }

    body.touch #loc {
      top: auto;
      bottom: 200px;
    }

    /* 載入畫面 */
    #loading {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      text-align: center;
      background: radial-gradient(ellipse at 50% 40%, #233a8f, #0a0f2e 70%);
      transition: opacity .9s ease;
    }

    #loading .t {
      font: 900 34px var(--serif);
      letter-spacing: .4em;
      margin-right: -.4em;
      color: #f7ecd0;
    }

    #loading .s {
      font: 500 11px var(--sans);
      letter-spacing: .5em;
      margin: 10px -.5em 26px 0;
      color: var(--text-dim);
    }

    #loading .bar {
      width: 220px;
      height: 2px;
      margin: 0 auto;
      background: rgba(255, 255, 255, .14);
      overflow: hidden;
      border-radius: 2px;
    }

    #loading .bar i {
      display: block;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      animation: slide 1.3s infinite ease-in-out;
    }

    @keyframes slide {
      from {
        transform: translateX(-100%);
      }

      to {
        transform: translateX(250%);
      }
    }
  </style>
</head>

<body>
  <div id="loading">
    <div>
      <div class="t">黎明原野</div>
      <div class="s">世界生成中</div>
      <div class="bar"><i></i></div>
    </div>
  </div>
  <div id="vignette"></div>
  <div id="banner">
    <div class="chapter">第一章 · 時之起點</div>
    <div class="name">黎明原野</div>
    <div class="orn"><span>DAWNFIELD</span></div>
  </div>
  <div id="loc" class="panel">
    <div class="gem"></div>
    <div>
      <div class="t">黎明原野</div>
      <div class="s">DAWNFIELD</div>
    </div>
  </div>
  <div id="help" class="panel">
    <div class="desk-only">
      <div class="row"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><span class="lab">移動</span><kbd>Shift</kbd><span
          class="lab">奔跑</span></div>
      <div class="row"><kbd>Space</kbd><span class="lab">跳躍</span><kbd>Q</kbd><kbd>E</kbd><span class="lab">旋轉視角</span>
      </div>
      <div class="row"><kbd>J</kbd><span class="lab">揮刀</span><span>或滑鼠左鍵點擊</span></div>
      <div class="row"><span>滑鼠拖曳旋轉 · 滾輪縮放</span></div>
    </div>
    <div class="touch-only">左下搖桿移動，推到底奔跑<br>右側拖曳旋轉視角 · 「斬」揮刀</div>
  </div>
  <div id="joy">
    <div id="knob"></div>
  </div>
  <button id="jumpBtn"><b>跳</b><small>JUMP</small></button>
  <button id="atkBtn"><b>斬</b><small>SLASH</small></button>

  <script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
  <script type="module">
    import * as THREE from 'three';
    import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
    if (isTouch) document.body.classList.add('touch');
    const LOW = isTouch;

    // ---------- 數學工具 / 噪聲 ----------
    const ss = (e0, e1, x) => { const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); };
    function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
    const rand = mulberry32(20261102);
    function hash2(ix, iy) {
      let h = (Math.imul(ix, 374761393) + Math.imul(iy, 668265263)) | 0;
      h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
      return (h >>> 0) / 4294967296;
    }
    function noise(x, y) {
      const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
      const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
      const a = hash2(ix, iy), b = hash2(ix + 1, iy), c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
      return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
    }
    function fbm(x, y, oct = 5) {
      let s = 0, a = 0.5, f = 1, n = 0;
      for (let i = 0; i < oct; i++) { s += a * noise(x * f + i * 17.3, y * f - i * 9.1); n += a; a *= 0.5; f *= 2.03; }
      return s / n;
    }

    // ---------- 地形定義 ----------
    const WATER_Y = -1.0;
    const riverX = z => 14 * Math.sin(z * 0.018) + 6 * Math.sin(z * 0.047 + 1.3);
    const BRIDGE_X = riverX(0);
    const BRIDGE_HALF = 16;
    const pathZ = x => Math.sin(x * 0.035) * 7 * ss(18, 45, Math.abs(x - BRIDGE_X));
    const deckY = x => 2.2 + 1.4 * Math.cos(Math.PI * (x - BRIDGE_X) / (2 * BRIDGE_HALF));
    const COTTAGE = { x: BRIDGE_X + 34, z: 0 };
    COTTAGE.z = pathZ(COTTAGE.x) - 12;

    function terrainHeight(x, z) {
      const d = Math.abs(x - riverX(z));
      const r = Math.hypot(x, z * 0.85);
      let h = (fbm(x * 0.012, z * 0.012, 4) - 0.5) * 7 + (noise(x * 0.07, z * 0.07) - 0.5) * 1.0 + 2.6;
      h += ss(35, 95, r) * ss(10, 30, d) * fbm(x * 0.02 + 9, z * 0.02 - 4, 3) * 12;
      const m = ss(80, 175, r) * ss(10, 50, d);
      if (m > 0) {
        const ridge = 1 - Math.abs(fbm(x * 0.007 + 5, z * 0.007 - 3, 5) * 2 - 1);
        h += m * (ridge * ridge * ridge * 110 + fbm(x * 0.03, z * 0.03, 4) * 28);
      }
      const fb = (1 - ss(5, 12, Math.abs(z))) * (1 - ss(16, 30, Math.abs(x - BRIDGE_X)));
      h += (1.9 - h) * fb;
      const fc = 1 - ss(6, 12, Math.hypot(x - COTTAGE.x, z - COTTAGE.z));
      h += (2.4 - h) * fc * 0.85;
      const bank = ss(4.5, 15, d);
      return -3.4 + (h + 3.4) * bank;
    }
    const onBridge = (x, z) => Math.abs(x - BRIDGE_X) <= BRIDGE_HALF + 0.3 && Math.abs(z) <= 1.9;
    const groundHeight = (x, z) => onBridge(x, z) ? Math.max(terrainHeight(x, z), deckY(x)) : terrainHeight(x, z);
    // 離水面的「岸邊高度」，加入雜訊讓沙地 / 草地交界不成一直線
    const shoreE = (x, z, y) => y - WATER_Y + (fbm(x * 0.09 + 40, z * 0.09 - 20, 3) - 0.5) * 1.1 + (noise(x * 0.6, z * 0.6) - 0.5) * 0.35;

    // ---------- Renderer / Scene ----------
    const renderer = new THREE.WebGLRenderer({ antialias: LOW, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, LOW ? 1.5 : 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 2000);

    const SKY_TOP = new THREE.Color(0x3f7fd6), SKY_HORIZON = new THREE.Color(0xcfe3f2), SKY_BOTTOM = new THREE.Color(0x9bb8c9);
    scene.fog = new THREE.Fog(SKY_HORIZON, 90, 480);

    const sunDir = new THREE.Vector3().setFromSphericalCoords(1, THREE.MathUtils.degToRad(52), THREE.MathUtils.degToRad(140));
    const U = { time: { value: 0 }, player: { value: new THREE.Vector3() }, slash: { value: new THREE.Vector4() } };

    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

    // ---------- 天空 ----------
    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false, fog: false,
      uniforms: {
        uTop: { value: SKY_TOP }, uHorizon: { value: SKY_HORIZON }, uBottom: { value: SKY_BOTTOM },
        uSunDir: { value: sunDir }, uSunColor: { value: new THREE.Color(0xfff1d0) }
      },
      vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
      fragmentShader: `
    uniform vec3 uTop, uHorizon, uBottom, uSunDir, uSunColor; varying vec3 vDir;
    void main(){
      vec3 d = normalize(vDir); float h = d.y;
      vec3 col = mix(uHorizon, uTop, pow(smoothstep(0.0, 1.0, h), 0.55));
      col = mix(col, uBottom, smoothstep(0.0, -0.3, h));
      float s = max(dot(d, uSunDir), 0.0);
      col += uSunColor * (pow(s, 6.0) * 0.18 + pow(s, 90.0) * 0.6);
      col += uSunColor * smoothstep(0.9994, 0.9997, s) * 6.0;
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
    });
    const sky = new THREE.Mesh(new THREE.SphereGeometry(900, 32, 16), skyMat);

    // 環境光照（IBL）來自天空
    const pmrem = new THREE.PMREMGenerator(renderer);
    const envScene = new THREE.Scene();
    envScene.add(sky);
    scene.environment = pmrem.fromScene(envScene, 0.04).texture;
    scene.add(sky);

    // ---------- 光源 ----------
    const hemi = new THREE.HemisphereLight(0xcfe6ff, 0x5b6b3a, 0.9);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xfff0d8, 2.8);
    sun.castShadow = true;
    sun.shadow.mapSize.set(LOW ? 1024 : 2048, LOW ? 1024 : 2048);
    Object.assign(sun.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, near: 1, far: 320 });
    sun.shadow.bias = -0.0004;
    sun.shadow.normalBias = 0.04;
    scene.add(sun, sun.target);

    // ---------- 程序化貼圖 ----------
    function canvasTex(w, h, draw, srgb = true) {
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      draw(c.getContext('2d'), w, h);
      const t = new THREE.CanvasTexture(c);
      if (srgb) t.colorSpace = THREE.SRGBColorSpace;
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return t;
    }
    const detailTex = canvasTex(256, 256, (g, w, h) => {
      const s = document.createElement('canvas'); s.width = s.height = 32;
      const sg = s.getContext('2d');
      for (let y = 0; y < 32; y++) for (let x = 0; x < 32; x++) { const v = 205 + Math.random() * 50 | 0; sg.fillStyle = `rgb(${v},${v},${v})`; sg.fillRect(x, y, 1, 1); }
      g.imageSmoothingEnabled = true; g.drawImage(s, 0, 0, w, h);
      const id = g.getImageData(0, 0, w, h);
      for (let i = 0; i < id.data.length; i += 4) { const n = (Math.random() - 0.5) * 26; id.data[i] += n; id.data[i + 1] += n; id.data[i + 2] += n; }
      g.putImageData(id, 0, 0);
    });
    const woodTex = canvasTex(256, 256, (g, w, h) => {
      g.fillStyle = '#b4875a'; g.fillRect(0, 0, w, h);

      FP.arms = [-1, 1].map(s => {
        const p = new THREE.Group(); p.position.set(0.06 * s, 0.19, 0); p.rotation.z = 0.5 * s; body.add(p);
        add(p, new THREE.CapsuleGeometry(0.016, 0.09, 3, 8), M.skin, 0, -0.06, 0);
        return p;
      });

      // 頭
      const head = new THREE.Group(); head.position.set(0, 0.32, 0); body.add(head); FP.head = head;
      add(head, new THREE.SphereGeometry(0.12, 24, 18), M.skin, 0, 0, 0);
      for (const s of [-1, 1]) {
        add(head, new THREE.SphereGeometry(0.024, 12, 10), M.eye, 0.043 * s, -0.008, 0.108).scale.set(0.85, 1.35, 0.5);
        add(head, new THREE.SphereGeometry(0.008, 6, 6), M.white, 0.043 * s + 0.007, 0.004, 0.118);
        add(head, new THREE.CircleGeometry(0.018, 12), M.cheek, 0.07 * s, -0.04, 0.1).rotation.y = 0.55 * s;
        // 尖耳朵
        const ear = add(head, new THREE.ConeGeometry(0.022, 0.08, 6), M.skin, 0.118 * s, 0.0, -0.005);
        ear.rotation.z = -1.25 * s;
      }
      const cap = add(head, new THREE.SphereGeometry(0.128, 24, 14, 0, Math.PI * 2, 0, Math.PI * 0.56), M.hair, 0, 0.008, -0.01);
      cap.rotation.x = -0.32;
      add(head, new THREE.SphereGeometry(0.115, 18, 12), M.hair, 0, -0.005, -0.03).scale.set(1.05, 1, 0.95);
      [[-0.07, 0.07], [-0.025, 0.09], [0.025, 0.09], [0.07, 0.07]].forEach(([x, y], i) => {
        const b = add(head, new THREE.SphereGeometry(0.035, 10, 8), i % 2 ? M.hairLight : M.hair, x, y, 0.09);
        b.scale.set(0.9, 1.2, 0.55);
      });
      // 雙丸子頭 + 雙馬尾
      FP.tails = [-1, 1].map(s => {
        add(head, new THREE.SphereGeometry(0.048, 14, 10), M.hair, 0.085 * s, 0.09, -0.04);
        const p = new THREE.Group(); p.position.set(0.1 * s, 0.07, -0.05); head.add(p);
        const t1 = add(p, new THREE.CylinderGeometry(0.03, 0.012, 0.2, 10).translate(0, -0.1, 0), M.hair, 0, 0, 0);
        t1.rotation.z = 0.35 * s;
        const t2 = add(p, new THREE.SphereGeometry(0.014, 8, 6), M.hairLight, 0.06 * s, -0.19, 0);
        return p;
      });
      // 花冠
      for (let i = 0; i < 7; i++) {
        const a = -1.2 + i * 0.4;
        add(head, new THREE.SphereGeometry(0.018, 8, 6), i % 2 ? M.flower : M.flower2, Math.sin(a) * 0.11, 0.075 + Math.cos(a) * 0.012, Math.cos(a) * 0.05);
      }

      // 翅膀（虹彩 shader）
      const wingMat = new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
        uniforms: { uTime: U.time },
        vertexShader: `varying vec2 vP; void main(){ vP = position.xy; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
        fragmentShader: `
      uniform float uTime; varying vec2 vP;
      void main(){
        float r = length(vP) / 0.4;
        vec3 a = vec3(0.55, 0.95, 1.0), b = vec3(1.0, 0.65, 0.95), c = vec3(1.0, 0.95, 0.6);
        float k = sin(r * 9.0 - uTime * 3.0) * 0.5 + 0.5;
        vec3 col = mix(mix(a, b, k), c, smoothstep(0.6, 1.0, r));
        float vein = 1.0 - smoothstep(0.0, 0.02, abs(fract(atan(vP.y, vP.x) * 4.0) - 0.5) - 0.47);
        float alpha = (0.25 + 0.55 * smoothstep(0.1, 0.9, r)) + vein * 0.3;
        gl_FragColor = vec4(col * alpha * 1.4, 1.0);
      }`
      });
      const wingShape = (w, h) => {
        const s = new THREE.Shape();
        s.moveTo(0, 0);
        s.bezierCurveTo(w * 0.3, h * 0.1, w * 1.1, h * 0.55, w * 0.85, h);
        s.bezierCurveTo(w * 0.6, h * 1.15, w * 0.1, h * 0.6, 0, 0);
        return new THREE.ShapeGeometry(s, 16);
      };
      const upperG = wingShape(0.3, 0.34), lowerG = wingShape(0.2, 0.18);
      FP.wings = [-1, 1].map(s => {
        const p = new THREE.Group(); p.position.set(0.012 * s, 0.17, -0.06); p.scale.x = s; body.add(p);
        add(p, upperG, wingMat, 0, 0, 0).rotation.z = 0.1;
        add(p, lowerG, wingMat, 0, 0, 0).rotation.z = -1.9;
        return p;
      });
      body.traverse(m => { if (m.isMesh && m.material !== wingMat) m.castShadow = true; });

      // 光暈 + 光源
      const haloMat = new THREE.SpriteMaterial({ map: sprite, color: 0xfff0b8, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0.85 });
      FP.halo = new THREE.Sprite(haloMat); FP.halo.scale.setScalar(1.7); FP.halo.position.y = 0.15; fairy.add(FP.halo);
      FP.core = new THREE.Sprite(new THREE.SpriteMaterial({ map: sprite, color: 0xffffff, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0.55 }));
      FP.core.scale.setScalar(0.6); FP.core.position.y = 0.15; fairy.add(FP.core);
      FP.light = new THREE.PointLight(0xffe2a0, 5, 7, 2); FP.light.position.y = 0.15; fairy.add(FP.light);
      fairy.scale.setScalar(0.85);
    }
    scene.add(fairy);

    // 妖精閃粉軌跡
    const DUST = 90;
    const dustGeo = new THREE.BufferGeometry();
    const dustPos = new Float32Array(DUST * 3), dustCol = new Float32Array(DUST * 3);
    const dust = Array.from({ length: DUST }, () => ({ life: 0, vx: 0, vy: 0, vz: 0 }));
    dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
    dustGeo.setAttribute('color', new THREE.BufferAttribute(dustCol, 3));
    const dustPts = new THREE.Points(dustGeo, new THREE.PointsMaterial({ map: sprite, size: 0.16, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
    dustPts.frustumCulled = false;
    scene.add(dustPts);
    let dustNext = 0, dustAcc = 0;
    const sparkTint = new THREE.Color(0xd8f0ff);
    function spawnSparks(x, y, z, n) {
      for (let i = 0; i < n; i++) {
        const d = dust[dustNext], j = dustNext * 3;
        dustNext = (dustNext + 1) % DUST;
        const a = Math.random() * Math.PI * 2, sp = 1.5 + Math.random() * 2.5;
        d.life = 0.8; d.c = sparkTint;
        d.vx = Math.cos(a) * sp; d.vy = 0.5 + Math.random() * 1.8; d.vz = Math.sin(a) * sp;
        dustPos[j] = x; dustPos[j + 1] = y; dustPos[j + 2] = z;
      }
    }

    // ---------- 後製 ----------
    let composer = null;
    if (!LOW) {
      const rt = new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type: THREE.HalfFloatType, samples: 4 });
      composer = new EffectComposer(renderer, rt);
      composer.setPixelRatio(renderer.getPixelRatio());
      composer.addPass(new RenderPass(scene, camera));
      composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.32, 0.55, 0.88));
      composer.addPass(new OutputPass());
    }

    // ---------- 輸入 ----------
    const keys = {};
    let jumpQueued = false;
    addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'Space') { jumpQueued = true; e.preventDefault(); }
      if (e.code === 'KeyJ' && !e.repeat) requestAttack();
      if (e.code.startsWith('Arrow')) e.preventDefault();
    });
    addEventListener('keyup', e => { keys[e.code] = false; });
    addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

    const joyEl = document.getElementById('joy'), knob = document.getElementById('knob');
    const joy = { x: 0, y: 0, id: null };
    function updateJoy(e) {
      const r = joyEl.getBoundingClientRect();
      let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
      const max = r.width / 2, len = Math.hypot(dx, dy);
      if (len > max) { dx *= max / len; dy *= max / len; }
      knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      joy.x = dx / max; joy.y = -dy / max;
    }
    joyEl.addEventListener('pointerdown', e => { joy.id = e.pointerId; joyEl.setPointerCapture(e.pointerId); updateJoy(e); e.preventDefault(); });
    joyEl.addEventListener('pointermove', e => { if (e.pointerId === joy.id) updateJoy(e); });
    const joyEnd = e => { if (e.pointerId !== joy.id) return; joy.id = null; joy.x = joy.y = 0; knob.style.transform = 'translate(-50%,-50%)'; };
    joyEl.addEventListener('pointerup', joyEnd);
    joyEl.addEventListener('pointercancel', joyEnd);
    document.getElementById('jumpBtn').addEventListener('pointerdown', e => { jumpQueued = true; e.preventDefault(); });
    document.getElementById('atkBtn').addEventListener('pointerdown', e => { requestAttack(); e.preventDefault(); });

    let camYaw = -Math.PI / 2, camPitch = 0.5, camDist = 12;
    const drag = { id: null, x: 0, y: 0, moved: 0, t0: 0 };
    const cvs = renderer.domElement;
    cvs.addEventListener('pointerdown', e => {
      if (drag.id !== null) return;
      Object.assign(drag, { id: e.pointerId, x: e.clientX, y: e.clientY, moved: 0, t0: performance.now() });
      cvs.setPointerCapture(e.pointerId);
    });
    cvs.addEventListener('pointermove', e => {
      if (e.pointerId !== drag.id) return;
      drag.moved += Math.hypot(e.clientX - drag.x, e.clientY - drag.y);
      camYaw -= (e.clientX - drag.x) * 0.0055;
      camPitch = THREE.MathUtils.clamp(camPitch + (e.clientY - drag.y) * 0.004, 0.12, 1.2);
      drag.x = e.clientX; drag.y = e.clientY;
    });
    const dragEnd = e => { if (e.pointerId === drag.id) drag.id = null; };
    cvs.addEventListener('pointerup', e => {
      if (e.pointerId === drag.id && e.pointerType === 'mouse' && e.button === 0 && drag.moved < 6 && performance.now() - drag.t0 < 350) requestAttack();
      dragEnd(e);
    });
    cvs.addEventListener('pointercancel', dragEnd);
    cvs.addEventListener('wheel', e => { camDist = THREE.MathUtils.clamp(camDist + e.deltaY * 0.01, 5, 24); e.preventDefault(); }, { passive: false });

    // ---------- 移動 / 碰撞 ----------
    function walkable(x, z) {
      if (Math.hypot(x, z) > 115) return false;
      if (onBridge(x, z)) return true;
      const h = terrainHeight(x, z);
      if (h < WATER_Y + 0.3) return false;
      const gx = terrainHeight(x + 0.5, z) - terrainHeight(x - 0.5, z), gz = terrainHeight(x, z + 0.5) - terrainHeight(x, z - 0.5);
      return Math.hypot(gx, gz) < 1.1;
    }
    const player = {
      pos: new THREE.Vector3(BRIDGE_X - 28, 0, 0), vel: new THREE.Vector2(), vy: 0, grounded: true,
      yaw: Math.PI / 2, walk: 0, phase: 0
    };
    player.pos.z = pathZ(player.pos.x);
    player.pos.y = groundHeight(player.pos.x, player.pos.z);
    const camTarget = player.pos.clone().add(new THREE.Vector3(0, 1.6, 0));
    camera.position.set(camTarget.x - camDist, camTarget.y + 6, camTarget.z);

    function updatePlayer(dt, t) {
      let ix = 0, iy = 0;
      if (keys.KeyW || keys.ArrowUp) iy += 1;
      if (keys.KeyS || keys.ArrowDown) iy -= 1;
      if (keys.KeyD || keys.ArrowRight) ix += 1;
      if (keys.KeyA || keys.ArrowLeft) ix -= 1;
      if (keys.KeyQ) camYaw += dt * 1.8;
      if (keys.KeyE) camYaw -= dt * 1.8;
      ix += joy.x; iy += joy.y;
      let mag = Math.hypot(ix, iy);
      if (mag > 1) { ix /= mag; iy /= mag; mag = 1; }
      const run = keys.ShiftLeft || keys.ShiftRight || (joy.id !== null && mag > 0.92);
      const maxSpd = (run ? 9.5 : 5) * (atk.t >= 0 ? 0.3 : 1);
      const sy = Math.sin(camYaw), cy = Math.cos(camYaw);
      const dx = cy * ix - sy * iy, dz = -sy * ix - cy * iy;
      const k = 1 - Math.exp(-dt * 10);
      player.vel.x += (dx * maxSpd - player.vel.x) * k;
      player.vel.y += (dz * maxSpd - player.vel.y) * k;

      const p = player.pos;
      const nx = p.x + player.vel.x * dt, nz = p.z + player.vel.y * dt;
      if (walkable(nx, nz)) { p.x = nx; p.z = nz; }
      else if (walkable(nx, p.z)) { p.x = nx; player.vel.y *= 0.5; }
      else if (walkable(p.x, nz)) { p.z = nz; player.vel.x *= 0.5; }
      else player.vel.set(0, 0);

      for (const c of colliders) {
        const ox = p.x - c.x, oz = p.z - c.z;
        if (Math.abs(ox) > 6 || Math.abs(oz) > 6) continue;
        const d = Math.hypot(ox, oz), min = c.r + 0.35;
        if (d < min && d > 1e-4) { p.x = c.x + ox / d * min; p.z = c.z + oz / d * min; }
      }

      const g = groundHeight(p.x, p.z);
      if (jumpQueued && player.grounded) { player.vy = 8.5; player.grounded = false; }
      jumpQueued = false;
      if (!player.grounded) {
        player.vy -= 24 * dt; p.y += player.vy * dt;
        if (p.y <= g) { p.y = g; player.vy = 0; player.grounded = true; }
      } else {
        if (p.y - g > 0.5) { player.grounded = false; player.vy = 0; }
        else p.y += (g - p.y) * Math.min(1, dt * 20);
      }

      const spd = player.vel.length();
      if (spd > 0.3 && atk.t < 0) {
        const target = Math.atan2(player.vel.x, player.vel.y);
        let d = target - player.yaw; d = Math.atan2(Math.sin(d), Math.cos(d));
        player.yaw += d * Math.min(1, dt * 12);
      }
      player.walk += ((spd > 0.2 ? Math.min(spd / 9.5 + 0.35, 1) : 0) - player.walk) * Math.min(1, dt * 8);
      player.phase += dt * (5 + spd * 1.15);

      const H = hero, w = player.walk, s = Math.sin(player.phase);
      H.root.position.copy(p);
      H.root.rotation.y = player.yaw;
      H.legs[0].rotation.x = s * 0.85 * w; H.legs[1].rotation.x = -s * 0.85 * w;
      H.arms[0].rotation.x = -s * 0.8 * w; H.arms[1].rotation.x = s * 0.8 * w;
      H.arms[0].rotation.z = -0.14; H.arms[1].rotation.z = 0.14; H.body.rotation.y = 0;
      const breathe = Math.sin(t * 2.2) * 0.012 * (1 - w);
      H.body.position.y = Math.abs(Math.cos(player.phase)) * 0.09 * w + breathe;
      H.body.rotation.x = w * 0.16 * (spd / 9.5 + 0.5);
      H.head.rotation.x = -H.body.rotation.x * 0.6 + Math.sin(t * 1.3) * 0.02;
      if (!player.grounded) { H.legs[0].rotation.x = -0.6; H.legs[1].rotation.x = 0.3; H.arms[0].rotation.x = H.arms[1].rotation.x = -0.9; }
      H.tails.forEach((tl, i) => {
        tl.rotation.x = 0.18 + w * 1.15 + Math.sin(t * (6 + w * 8) + i * 1.7) * (0.06 + 0.12 * w);
        tl.rotation.z = Math.sin(t * 3 + i) * 0.08;
      });
      U.player.value.copy(p);
    }

    function updateAttack(dt) {
      const H = hero, arm = H.arms[0];
      if (atk.queued && atk.t < 0) {
        atk.queued = false; atk.t = 0; atk.idle = 0; atk.hit = false;
        if (!atk.drawn) { holdSword(true); atk.drawn = true; }
      }
      U.slash.value.w *= Math.exp(-dt * 4);
      if (atk.t < 0) {
        trail.visible = false;
        if (atk.drawn) {
          arm.rotation.x = arm.rotation.x * 0.5 - 0.35;
          if ((atk.idle += dt) > 2.5) { holdSword(false); atk.drawn = false; }
        }
        return;
      }
      atk.t += dt / atk.dur;
      const p = Math.min(atk.t, 1);
      const rest = { ax: arm.rotation.x, az: -0.14, by: 0, lean: H.body.rotation.x };
      const pose = p < 0.32 ? lerpPose(rest, WINDUP, easeOut(p / 0.32))
        : p < 0.52 ? lerpPose(WINDUP, STRIKE, easeOut((p - 0.32) / 0.2))
          : lerpPose(STRIKE, rest, ss(0.52, 1, p));
      arm.rotation.x = pose.ax; arm.rotation.z = pose.az;
      H.body.rotation.y = pose.by; H.body.rotation.x = pose.lean;
      H.arms[1].rotation.x = Math.min(H.arms[1].rotation.x, -0.6 * Math.sin(p * Math.PI));

      trail.visible = true;
      trailMat.uniforms.uHead.value = ss(0.32, 0.52, p);
      trailMat.uniforms.uFade.value = ss(0.3, 0.36, p) * (1 - ss(0.55, 0.85, p));

      if (!atk.hit && p >= 0.45) {
        atk.hit = true;
        const fx = player.pos.x + Math.sin(player.yaw) * 1.3, fz = player.pos.z + Math.cos(player.yaw) * 1.3;
        U.slash.value.set(fx, 0, fz, 1);
        spawnSparks(fx, player.pos.y + 0.6, fz, 16);
      }
      if (atk.t >= 1) atk.t = -1;
    }

    const fairyVel = new THREE.Vector3();
    const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _up = new THREE.Vector3(0, 1, 0);
    const dustTint = [new THREE.Color(0xfff2a8), new THREE.Color(0xbff4ff), new THREE.Color(0xffc4ec)];
    function updateFairy(dt, t) {
      const moving = player.vel.length() > 0.5;
      const orbit = moving ? 0 : Math.sin(t * 0.6) * 0.9;
      const ang = player.yaw + Math.PI * 0.72 + orbit;
      const target = new THREE.Vector3(player.pos.x + Math.sin(ang) * 1.5, 0, player.pos.z + Math.cos(ang) * 1.5);
      target.y = Math.max(player.pos.y, groundHeight(target.x, target.z)) + 1.9 + Math.sin(t * 2.1) * 0.18 + Math.sin(t * 3.7) * 0.05;
      fairyVel.lerp(target.sub(fairy.position).multiplyScalar(3.4), Math.min(1, dt * 4));
      fairy.position.addScaledVector(fairyVel, dt);

      const look = moving
        ? new THREE.Vector3(fairy.position.x + player.vel.x, fairy.position.y, fairy.position.z + player.vel.y)
        : new THREE.Vector3(player.pos.x, fairy.position.y, player.pos.z);
      _m4.lookAt(look, fairy.position, _up);
      fairy.quaternion.slerp(_q.setFromRotationMatrix(_m4), Math.min(1, dt * 5));

      const sp = Math.min(fairyVel.length() / 8, 1);
      FP.body.rotation.x = 0.15 + sp * 0.45;
      FP.body.rotation.z = Math.sin(t * 1.4) * 0.12;
      const flap = Math.sin(t * 32);
      FP.wings.forEach(w => { w.rotation.y = -(0.35 + flap * 0.55); w.rotation.x = 0.15; });
      FP.legs.forEach((l, i) => { l.rotation.x = 0.3 + sp * 0.5 + Math.sin(t * 3 + i * 1.6) * 0.18; });
      FP.arms.forEach((a, i) => { a.rotation.x = Math.sin(t * 2.4 + i * 2) * 0.35 - sp * 0.6; });
      FP.tails.forEach((tl, i) => { tl.rotation.x = 0.25 + sp * 0.9 + Math.sin(t * 4 + i) * 0.12; tl.rotation.z = Math.sin(t * 2.2 + i * 2) * 0.1; });
      FP.head.rotation.z = Math.sin(t * 0.9) * 0.12;
      const pulse = 1 + Math.sin(t * 3.1) * 0.08 + Math.sin(t * 7.3) * 0.04;
      FP.halo.scale.setScalar(1.7 * pulse);
      FP.core.scale.setScalar(0.6 * (2 - pulse));
      FP.light.intensity = 5 * pulse;

      dustAcc += dt * (14 + sp * 40);
      while (dustAcc > 1) {
        dustAcc -= 1;
        const d = dust[dustNext], j = dustNext * 3;
        dustNext = (dustNext + 1) % DUST;
        d.life = 1;
        d.vx = (Math.random() - 0.5) * 0.4; d.vy = -0.25 - Math.random() * 0.4; d.vz = (Math.random() - 0.5) * 0.4;
        d.c = dustTint[(Math.random() * 3) | 0];
        dustPos[j] = fairy.position.x + (Math.random() - 0.5) * 0.25;
        dustPos[j + 1] = fairy.position.y + 0.1 + (Math.random() - 0.5) * 0.25;
        dustPos[j + 2] = fairy.position.z + (Math.random() - 0.5) * 0.25;
      }
      for (let i = 0; i < DUST; i++) {
        const d = dust[i], j = i * 3;
        if (d.life <= 0) { dustCol[j] = dustCol[j + 1] = dustCol[j + 2] = 0; continue; }
        d.life -= dt * 0.9;
        dustPos[j] += d.vx * dt; dustPos[j + 1] += d.vy * dt; dustPos[j + 2] += d.vz * dt;
        const a = Math.max(d.life, 0) * (0.6 + 0.4 * Math.sin(t * 20 + i));
        dustCol[j] = d.c.r * a; dustCol[j + 1] = d.c.g * a; dustCol[j + 2] = d.c.b * a;
      }
      dustGeo.attributes.position.needsUpdate = true;
      dustGeo.attributes.color.needsUpdate = true;
    }

    function updateCamera(dt) {
      const want = player.pos.clone(); want.y += 1.6;
      camTarget.lerp(want, 1 - Math.exp(-dt * 8));
      const cp = Math.cos(camPitch);
      const desired = new THREE.Vector3(
        camTarget.x + Math.sin(camYaw) * cp * camDist,
        camTarget.y + Math.sin(camPitch) * camDist,
        camTarget.z + Math.cos(camYaw) * cp * camDist);
      const minY = terrainHeight(desired.x, desired.z) + 1.2;
      if (desired.y < minY) desired.y = minY;
      camera.position.lerp(desired, 1 - Math.exp(-dt * 10));
      camera.lookAt(camTarget);
    }

    function updatePollen(t) {
      const a = pollenGeo.attributes.position, p = player.pos;
      for (let i = 0; i < POLLEN; i++) {
        const s = pollenSeed[i], j = i * 3;
        let x = pollenPos[j], z = pollenPos[j + 2];
        x += Math.sin(t * 0.3 + s) * 0.01 + 0.006; z += Math.cos(t * 0.25 + s * 1.3) * 0.01;
        if (x - p.x > 25) x -= 50; if (x - p.x < -25) x += 50;
        if (z - p.z > 25) z -= 50; if (z - p.z < -25) z += 50;
        pollenPos[j] = x; pollenPos[j + 2] = z;
        pollenPos[j + 1] = terrainHeight(x, z) + 0.6 + (Math.sin(t * 0.5 + s) * 0.5 + 0.5) * 3.5;
      }
      a.needsUpdate = true;
    }

    // ---------- 主迴圈 ----------
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      composer?.setSize(innerWidth, innerHeight);
    });

    const clock = new THREE.Clock();
    let pollenTick = 0;
    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
      U.time.value = t;
      waterMat.uniforms.uTime.value = t;
      updatePlayer(dt, t);
      updateAttack(dt);
      updateFairy(dt, t);
      updateCamera(dt);
      if (!LOW || (pollenTick++ & 1)) updatePollen(t);
      for (const c of clouds) { c.position.x += dt * 1.6; if (c.position.x > 520) c.position.x = -520; }
      sky.position.copy(camera.position);
      sun.position.copy(player.pos).addScaledVector(sunDir, 150);
      sun.target.position.copy(player.pos);
      composer ? composer.render() : renderer.render(scene, camera);
    });

    const loading = document.getElementById('loading');
    loading.style.opacity = 0;
    setTimeout(() => loading.remove(), 900);
    setTimeout(() => { document.getElementById('banner').classList.add('hide'); document.getElementById('loc').classList.add('show'); }, 5200);
  </script>
</body>

</html>
