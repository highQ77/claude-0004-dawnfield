<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8" />
  <meta name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>黎明原野 Dawnfield</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --gold: #e9c77b;
      --gold-soft: rgba(233, 199, 123, .5);
      --gold-faint: rgba(233, 199, 123, .18);
      --panel-a: rgba(84, 86, 92, .8);
      --panel-b: rgba(30, 31, 35, .85);
      --text: #f7f2e4;
      --text-dim: #cfc7b1;
      --serif: "Noto Serif TC", "Songti TC", serif;
      --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #9fc6e8;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      font-family: var(--sans);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    canvas {
      display: block;
      touch-action: none;
    }

    .panel {
      position: fixed;
      pointer-events: none;
      background: linear-gradient(160deg, var(--panel-a), var(--panel-b));
      -webkit-backdrop-filter: blur(10px) saturate(1.25);
      backdrop-filter: blur(10px) saturate(1.25);
      border: 1px solid var(--gold-soft);
      border-radius: 12px;
      box-shadow: 0 12px 32px rgba(8, 8, 12, .4), inset 0 1px 0 rgba(255, 255, 255, .14);
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 4px;
      border-radius: 9px;
      border: 1px solid var(--gold-faint);
      pointer-events: none;
    }

    /* 開場地名橫幅 */
    #banner {
      position: fixed;
      top: 10vh;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
      white-space: nowrap;
      text-shadow: 0 2px 12px rgba(20, 21, 26, .6), 0 0 2px rgba(20, 21, 26, .65);
      transition: opacity 1.4s ease, transform 1.4s ease;
    }

    #banner .chapter {
      font: 600 13px var(--serif);
      letter-spacing: .5em;
      color: var(--gold);
      opacity: 0;
      animation: fadeUp 1s .5s forwards;
    }

    #banner .name {
      font: 900 clamp(34px, 7vw, 60px)/1.15 var(--serif);
      letter-spacing: .32em;
      margin: 6px 0 4px .32em;
      color: #fff;
      filter: drop-shadow(0 3px 10px rgba(20, 21, 26, .55));
      animation: nameIn 1.6s .8s both cubic-bezier(.2, .7, .2, 1);
    }

    #banner .orn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      opacity: 0;
      animation: fadeUp 1s 1.6s forwards;
    }

    #banner .orn::before,
    #banner .orn::after {
      content: "";
      width: 72px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold));
    }

    #banner .orn::after {
      transform: scaleX(-1);
    }

    #banner .orn span {
      font: 500 11px var(--sans);
      letter-spacing: .6em;
      margin-right: -.6em;
      color: var(--text-dim);
    }

    #banner.hide {
      opacity: 0;
      transform: translate(-50%, -12px);
    }

    @keyframes nameIn {
      from {
        opacity: 0;
        letter-spacing: .7em;
        filter: blur(8px);
      }

      to {
        opacity: 1;
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    /* 左上角地點 */
    #loc {
      top: 16px;
      left: 16px;
      padding: 10px 18px 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity .8s, transform .8s;
    }

    #loc.show {
      opacity: 1;
      transform: none;
    }

    #loc .gem {
      width: 12px;
      height: 12px;
      transform: rotate(45deg);
      background: linear-gradient(135deg, #fff1c4, var(--gold) 55%, #9a7330);
      box-shadow: 0 0 10px rgba(233, 199, 123, .7);
    }

    #loc .t {
      font: 700 15px var(--serif);
      letter-spacing: .25em;
    }

    #loc .s {
      font: 500 9px var(--sans);
      letter-spacing: .4em;
      color: var(--text-dim);
      margin-top: 1px;
    }

    /* 操作說明 */
    #help {
      bottom: 16px;
      right: 16px;
      padding: 12px 16px;
      font-size: 12px;
      color: var(--text-dim);
      max-width: calc(100vw - 32px);
    }

    #help .row {
      display: flex;
      align-items: center;
      gap: 8px;
      line-height: 1;
    }

    #help .row+.row {
      margin-top: 8px;
    }

    #help .lab {
      margin-left: 2px;
      min-width: 52px;
      color: var(--text);
    }

    kbd {
      display: inline-grid;
      place-items: center;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border-radius: 5px;
      font: 700 10.5px var(--sans);
      color: #2b2214;
      background: linear-gradient(180deg, #fffaf0, #dccfae);
      box-shadow: 0 2px 0 #8c7a52, 0 3px 6px rgba(0, 0, 0, .3);
    }

    .touch-only {
      display: none;
    }

    body.touch .touch-only {
      display: block;
    }

    body.touch .desk-only {
      display: none;
    }

    body.touch #help {
      top: 16px;
      bottom: auto;
      padding: 8px 12px;
      font-size: 11px;
      max-width: 46vw;
      line-height: 1.5;
    }

    #vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 58%, rgba(18, 19, 24, .34) 100%);
    }

    /* 虛擬搖桿 */
    #joy {
      position: fixed;
      left: max(24px, env(safe-area-inset-left));
      bottom: max(32px, env(safe-area-inset-bottom));
      width: 148px;
      height: 148px;
      border-radius: 50%;
      display: none;
      z-index: 5;
      touch-action: none;
      background: radial-gradient(circle, rgba(70, 72, 78, .18) 40%, rgba(40, 42, 48, .5));
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      border: 1px solid var(--gold-soft);
      box-shadow: 0 8px 24px rgba(8, 8, 12, .34), inset 0 0 0 6px rgba(255, 255, 255, .05);
    }

    #joy::before {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      border: 1px dashed var(--gold-faint);
    }

    #joy::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        conic-gradient(from -4deg, var(--gold) 0 8deg, transparent 8deg 90deg, var(--gold) 90deg 98deg, transparent 98deg 180deg,
          var(--gold) 180deg 188deg, transparent 188deg 270deg, var(--gold) 270deg 278deg, transparent 278deg);
      -webkit-mask: radial-gradient(circle, transparent 66px, #000 67px 70px, transparent 71px);
      mask: radial-gradient(circle, transparent 66px, #000 67px 70px, transparent 71px);
      opacity: .7;
    }

    #knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      z-index: 1;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle at 36% 30%, #fffaf0, #f0d898 45%, #b78d45 100%);
      box-shadow: 0 6px 16px rgba(0, 0, 0, .4), inset 0 -3px 6px rgba(90, 60, 20, .45), inset 0 2px 3px rgba(255, 255, 255, .8);
    }

    #knob::after {
      content: "";
      position: absolute;
      inset: 18px;
      border-radius: 50%;
      border: 1px solid rgba(120, 85, 30, .35);
    }

    #jumpBtn,
    #atkBtn {
      position: fixed;
      right: max(28px, env(safe-area-inset-right));
      bottom: max(48px, env(safe-area-inset-bottom));
      width: 88px;
      height: 88px;
      border-radius: 50%;
      display: none;
      z-index: 5;
      touch-action: none;
      border: 1px solid var(--gold-soft);
      color: var(--text);
      background: radial-gradient(circle at 50% 35%, rgba(118, 120, 127, .9), rgba(34, 35, 40, .92));
      box-shadow: 0 8px 22px rgba(8, 8, 12, .4), inset 0 0 0 5px rgba(233, 199, 123, .14), inset 0 1px 0 rgba(255, 255, 255, .2);
      transition: transform .08s, filter .08s;
    }

    #jumpBtn b,
    #atkBtn b {
      display: block;
      font: 900 26px/1 var(--serif);
      color: var(--gold);
    }

    #jumpBtn small,
    #atkBtn small {
      display: block;
      font: 600 9px var(--sans);
      letter-spacing: .3em;
      margin: 4px -.3em 0 0;
      color: var(--text-dim);
    }

    #atkBtn {
      right: calc(max(28px, env(safe-area-inset-right)) + 100px);
      bottom: max(28px, env(safe-area-inset-bottom));
      width: 76px;
      height: 76px;
      background: radial-gradient(circle at 50% 35%, rgba(132, 84, 84, .9), rgba(40, 30, 32, .92));
    }

    #jumpBtn:active,
    #atkBtn:active {
      transform: scale(.94);
      filter: brightness(1.25);
    }

    body.touch #joy,
    body.touch #jumpBtn,
    body.touch #atkBtn {
      display: block;
    }

    /* NPC 頭上的提示泡泡 / 對話提示 */
    .npc-mark {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 4;
      pointer-events: none;
      transform: translate(-50%, -100%);
      transition: opacity .3s;
      opacity: 0;
    }

    .npc-mark.show {
      opacity: 1;
    }

    #npcBubble {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      font: 900 17px/1 var(--serif);
      color: #2b2214;
      background: radial-gradient(circle at 40% 30%, #fffaf0, var(--gold) 70%, #b48a3e);
      box-shadow: 0 3px 10px rgba(0, 0, 0, .35), 0 0 14px rgba(233, 199, 123, .55);
      animation: bob 1.6s ease-in-out infinite;
    }

    #npcBubble::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -5px;
      margin-left: -5px;
      border: 5px solid transparent;
      border-bottom: 0;
      border-top-color: #c79a4a;
    }

    @keyframes bob {
      50% {
        translate: 0 -5px;
      }
    }

    #npcPrompt {
      padding: 6px 12px 6px 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      font: 500 12px var(--sans);
      letter-spacing: .12em;
      white-space: nowrap;
      margin-top: -6px;
    }

    #npcPrompt kbd {
      min-width: 20px;
      height: 20px;
    }

    body.touch #npcPrompt kbd {
      display: none;
    }

    /* 對話框 */
    #dialog {
      left: 50%;
      bottom: max(24px, env(safe-area-inset-bottom));
      width: min(720px, calc(100vw - 32px));
      min-height: 124px;
      padding: 22px 28px 20px;
      transform: translate(-50%, 16px);
      opacity: 0;
      transition: opacity .25s, transform .25s;
      z-index: 6;
    }

    #dialog.open {
      opacity: 1;
      transform: translate(-50%, 0);
      pointer-events: auto;
    }

    #dialog .who {
      position: absolute;
      top: -15px;
      left: 22px;
      padding: 5px 16px 5px 14px;
      font: 700 14px var(--serif);
      letter-spacing: .3em;
      color: #2b2214;
      border-radius: 6px;
      background: linear-gradient(180deg, #f6dfa4, var(--gold) 60%, #c39a4c);
      box-shadow: 0 4px 10px rgba(0, 0, 0, .35);
    }

    #dialog .line {
      font: 500 16px/1.75 var(--sans);
      letter-spacing: .04em;
      color: var(--text);
      min-height: 56px;
    }

    #dialog .next {
      position: absolute;
      right: 20px;
      bottom: 12px;
      width: 0;
      height: 0;
      border: 6px solid transparent;
      border-bottom: 0;
      border-top: 8px solid var(--gold);
      opacity: 0;
    }

    #dialog.done .next {
      opacity: 1;
      animation: bob 1s ease-in-out infinite;
    }

    body.dialog #help,
    body.dialog #joy,
    body.dialog #jumpBtn,
    body.dialog #atkBtn {
      opacity: 0;
      pointer-events: none;
    }

    #help {
      transition: opacity .25s;
    }

    body.touch #loc {
      top: auto;
      bottom: 200px;
    }

    /* 載入畫面 */
    #loading {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      text-align: center;
      background: radial-gradient(ellipse at 50% 40%, #5a5d63, #18191c 70%);
      transition: opacity .9s ease;
    }

    #loading .t {
      font: 900 34px var(--serif);
      letter-spacing: .4em;
      margin-right: -.4em;
      color: #f7ecd0;
    }

    #loading .s {
      font: 500 11px var(--sans);
      letter-spacing: .5em;
      margin: 10px -.5em 26px 0;
      color: var(--text-dim);
    }

    #loading .bar {
      width: 220px;
      height: 2px;
      margin: 0 auto;
      background: rgba(255, 255, 255, .14);
      overflow: hidden;
      border-radius: 2px;
    }

    #loading .bar i {
      display: block;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      animation: slide 1.3s infinite ease-in-out;
    }

    @keyframes slide {
      from {
        transform: translateX(-100%);
      }

      to {
        transform: translateX(250%);
      }
    }
  </style>
</head>

<body>
  <div id="loading">
    <div>
      <div class="t">黎明原野</div>
      <div class="s">世界生成中</div>
      <div class="bar"><i></i></div>
    </div>
  </div>
  <div id="vignette"></div>
  <div id="banner">
    <div class="chapter">第一章 · 時之起點</div>
    <div class="name">黎明原野</div>
    <div class="orn"><span>DAWNFIELD</span></div>
  </div>
  <div id="loc" class="panel">
    <div class="gem"></div>
    <div>
      <div class="t">黎明原野</div>
      <div class="s">DAWNFIELD</div>
    </div>
  </div>
  <div id="help" class="panel">
    <div class="desk-only">
      <div class="row"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><span class="lab">移動</span><kbd>Shift</kbd><span
          class="lab">奔跑</span></div>
      <div class="row"><kbd>Space</kbd><span class="lab">跳躍</span><kbd>Q</kbd><kbd>E</kbd><span class="lab">旋轉視角</span>
      </div>
      <div class="row"><kbd>J</kbd><span class="lab">揮刀</span><span>或滑鼠左鍵點擊</span></div>
      <div class="row"><kbd>F</kbd><span class="lab">交談</span><span>靠近村民時</span></div>
      <div class="row"><span>滑鼠拖曳旋轉 · 滾輪縮放</span></div>
    </div>
    <div class="touch-only">左下搖桿移動，推到底奔跑<br>右側拖曳旋轉視角 · 「斬」揮刀<br>靠近村民後點一下對話</div>
  </div>
  <div id="joy">
    <div id="knob"></div>
  </div>
  <button id="jumpBtn"><b>跳</b><small>JUMP</small></button>
  <button id="atkBtn"><b>斬</b><small>SLASH</small></button>
  <div id="npcBubble" class="npc-mark">!</div>
  <div id="npcPrompt" class="npc-mark panel"><kbd>F</kbd><span>交談</span></div>
  <div id="dialog" class="panel">
    <div class="who">莉諾</div>
    <div class="line"></div>
    <div class="next"></div>
  </div>

  <script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
  <script type="module">
    import * as THREE from 'three';
    import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

    const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
    if (isTouch) document.body.classList.add('touch');
    const LOW = isTouch;

    // ---------- 數學工具 / 噪聲 ----------
    const ss = (e0, e1, x) => { const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); };
    function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
    const rand = mulberry32(20261102);
    function hash2(ix, iy) {
      let h = (Math.imul(ix, 374761393) + Math.imul(iy, 668265263)) | 0;
      h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
      return (h >>> 0) / 4294967296;
    }
    function noise(x, y) {
      const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
      const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
      const a = hash2(ix, iy), b = hash2(ix + 1, iy), c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
      return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
    }
    function fbm(x, y, oct = 5) {
      let s = 0, a = 0.5, f = 1, n = 0;
      for (let i = 0; i < oct; i++) { s += a * noise(x * f + i * 17.3, y * f - i * 9.1); n += a; a *= 0.5; f *= 2.03; }
      return s / n;
    }

    // ---------- 地形定義 ----------
    const WATER_Y = -1.0;
    const riverX = z => 14 * Math.sin(z * 0.018) + 6 * Math.sin(z * 0.047 + 1.3);
    const BRIDGE_X = riverX(0);
    const BRIDGE_HALF = 16;
    const pathZ = x => Math.sin(x * 0.035) * 7 * ss(18, 45, Math.abs(x - BRIDGE_X));
    const deckY = x => 2.2 + 1.4 * Math.cos(Math.PI * (x - BRIDGE_X) / (2 * BRIDGE_HALF));
    const COTTAGE = { x: BRIDGE_X + 34, z: 0 };
    COTTAGE.z = pathZ(COTTAGE.x) - 12;

    function terrainHeight(x, z) {
      const d = Math.abs(x - riverX(z));
      const r = Math.hypot(x, z * 0.85);
      let h = (fbm(x * 0.012, z * 0.012, 4) - 0.5) * 7 + (noise(x * 0.07, z * 0.07) - 0.5) * 1.0 + 2.6;
      h += ss(35, 95, r) * ss(10, 30, d) * fbm(x * 0.02 + 9, z * 0.02 - 4, 3) * 12;
      const m = ss(80, 175, r) * ss(10, 50, d);
      if (m > 0) {
        const ridge = 1 - Math.abs(fbm(x * 0.007 + 5, z * 0.007 - 3, 5) * 2 - 1);
        h += m * (ridge * ridge * ridge * 110 + fbm(x * 0.03, z * 0.03, 4) * 28);
      }
      const fb = (1 - ss(5, 12, Math.abs(z))) * (1 - ss(16, 30, Math.abs(x - BRIDGE_X)));
      h += (1.9 - h) * fb;
      const fc = 1 - ss(6, 12, Math.hypot(x - COTTAGE.x, z - COTTAGE.z));
      h += (2.4 - h) * fc * 0.85;
      const bank = ss(4.5, 15, d);
      return -3.4 + (h + 3.4) * bank;
    }
    const onBridge = (x, z) => Math.abs(x - BRIDGE_X) <= BRIDGE_HALF + 0.3 && Math.abs(z) <= 1.9;
    const groundHeight = (x, z) => onBridge(x, z) ? Math.max(terrainHeight(x, z), deckY(x)) : terrainHeight(x, z);
    // 離水面的「岸邊高度」，加入雜訊讓沙地 / 草地交界不成一直線
    const shoreE = (x, z, y) => y - WATER_Y + (fbm(x * 0.09 + 40, z * 0.09 - 20, 3) - 0.5) * 1.1 + (noise(x * 0.6, z * 0.6) - 0.5) * 0.35;

    // ---------- Renderer / Scene ----------
    const renderer = new THREE.WebGLRenderer({ antialias: LOW, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, LOW ? 1.5 : 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.prepend(renderer.domElement);

    const scene = new THREE.Scene();

    // 橋的扶手（z = ±2.15）：沿整座橋長度設一條禁行帶，寬度含角色半徑（~0.35）並大於單幀最大位移，

      } else {
        if (p.y - g > 0.5) { player.grounded = false; player.vy = 0; }
        else p.y += (g - p.y) * Math.min(1, dt * 20);

        player.yaw += d * Math.min(1, dt * 12);
      }
      player.walk += ((spd > 0.2 ? Math.min(spd / 9.5 + 0.35, 1) : 0) - player.walk) * Math.min(1, dt * 8);
      player.phase += dt * (5 + spd * 1.15);

      const H = hero, w = player.walk, s = Math.sin(player.phase);
      H.root.position.copy(p);
      H.root.rotation.y = player.yaw;
      H.legs[0].rotation.x = s * 0.85 * w; H.legs[1].rotation.x = -s * 0.85 * w;
      H.arms[0].rotation.x = -s * 0.8 * w; H.arms[1].rotation.x = s * 0.8 * w;
      H.arms[0].rotation.z = -0.14; H.arms[1].rotation.z = 0.14; H.body.rotation.y = 0;
      const breathe = Math.sin(t * 2.2) * 0.012 * (1 - w);
      H.body.position.y = Math.abs(Math.cos(player.phase)) * 0.09 * w + breathe;
      H.body.rotation.x = w * 0.16 * (spd / 9.5 + 0.5);
      H.head.rotation.x = -H.body.rotation.x * 0.6 + Math.sin(t * 1.3) * 0.02;
      if (!player.grounded) { H.legs[0].rotation.x = -0.6; H.legs[1].rotation.x = 0.3; H.arms[0].rotation.x = H.arms[1].rotation.x = -0.9; }
      H.tails.forEach((tl, i) => {
        tl.rotation.x = 0.18 + w * 1.15 + Math.sin(t * (6 + w * 8) + i * 1.7) * (0.06 + 0.12 * w);
        tl.rotation.z = Math.sin(t * 3 + i) * 0.08;
      });
      U.player.value.copy(p);
    }

    function updateAttack(dt) {
      const H = hero, arm = H.arms[0];
      if (atk.queued && atk.t < 0) {
        atk.queued = false; atk.t = 0; atk.idle = 0; atk.hit = false;
        if (!atk.drawn) { holdSword(true); atk.drawn = true; }
      }
      U.slash.value.w *= Math.exp(-dt * 4);
      if (atk.t < 0) {
        if (atk.drawn) {
          arm.rotation.x = arm.rotation.x * 0.5 - 0.35;
          if ((atk.idle += dt) > 2.5) { holdSword(false); atk.drawn = false; }
        }
        return;
      }
      atk.t += dt / atk.dur;
      const p = Math.min(atk.t, 1);
      const rest = { ax: arm.rotation.x, az: -0.14, by: 0, lean: H.body.rotation.x };
      const pose = p < 0.3 ? lerpPose(rest, WINDUP, easeOut(p / 0.3))
        : p < 0.56 ? lerpPose(WINDUP, STRIKE, 1 - Math.pow(1 - (p - 0.3) / 0.26, 2))
          : lerpPose(STRIKE, rest, ss(0.56, 1, p));
      arm.rotation.x = pose.ax; arm.rotation.z = pose.az;
      H.body.rotation.y = pose.by; H.body.rotation.x = pose.lean;
      // 起手時手腕轉成水平握法，收招時轉回
      const grip = ss(0.04, 0.26, p) * (1 - ss(0.7, 0.95, p));
      H.sword.quaternion.slerpQuaternions(SWORD_HAND_Q, SWORD_SLASH_Q, grip);
      H.sword.position.lerpVectors(SWORD_HAND_POS, SWORD_SLASH_POS, grip);
      H.arms[1].rotation.x = Math.min(H.arms[1].rotation.x, -0.6 * Math.sin(p * Math.PI));


      if (!atk.hit && p >= 0.43) {
        atk.hit = true;
        const fx = player.pos.x + Math.sin(player.yaw) * 1.3, fz = player.pos.z + Math.cos(player.yaw) * 1.3;
        U.slash.value.set(fx, 0, fz, 1);
        spawnSparks(fx, player.pos.y + 0.6, fz, 16);
        // 揮過花叢：花瓣飛散
        for (const b of bushes) if (Math.abs(b.x - player.pos.x) < 2.6 && Math.abs(b.z - player.pos.z) < 2.6 && Math.hypot(b.x - player.pos.x, b.z - player.pos.z) < 2.4)
          spawnSparks(b.x, b.h + 0.45 * b.s, b.z, 7, b.color);
      }
      if (atk.t >= 1) atk.t = -1;
    }

    const fairyVel = new THREE.Vector3();
    const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _up = new THREE.Vector3(0, 1, 0);
    const dustTint = [new THREE.Color(0xfff2a8), new THREE.Color(0xbff4ff), new THREE.Color(0xffc4ec)];
    function updateFairy(dt, t) {
      const moving = player.vel.length() > 0.5;
      const orbit = moving ? 0 : Math.sin(t * 0.6) * 0.9;
      const ang = player.yaw + Math.PI * 0.72 + orbit;
      const target = new THREE.Vector3(player.pos.x + Math.sin(ang) * 1.5, 0, player.pos.z + Math.cos(ang) * 1.5);
      target.y = Math.max(player.pos.y, groundHeight(target.x, target.z)) + 1.9 + Math.sin(t * 2.1) * 0.18 + Math.sin(t * 3.7) * 0.05;
      fairyVel.lerp(target.sub(fairy.position).multiplyScalar(3.4), Math.min(1, dt * 4));
      fairy.position.addScaledVector(fairyVel, dt);

      const look = moving
        ? new THREE.Vector3(fairy.position.x + player.vel.x, fairy.position.y, fairy.position.z + player.vel.y)
        : new THREE.Vector3(player.pos.x, fairy.position.y, player.pos.z);
      _m4.lookAt(look, fairy.position, _up);
      fairy.quaternion.slerp(_q.setFromRotationMatrix(_m4), Math.min(1, dt * 5));

      const sp = Math.min(fairyVel.length() / 8, 1);
      FP.body.rotation.x = 0.15 + sp * 0.45;
      FP.body.rotation.z = Math.sin(t * 1.4) * 0.12;
      const flap = Math.sin(t * 32);
      FP.wings.forEach(w => { w.rotation.y = -(0.35 + flap * 0.55); w.rotation.x = 0.15; });
      FP.legs.forEach((l, i) => { l.rotation.x = 0.3 + sp * 0.5 + Math.sin(t * 3 + i * 1.6) * 0.18; });
      FP.arms.forEach((a, i) => { a.rotation.x = Math.sin(t * 2.4 + i * 2) * 0.35 - sp * 0.6; });
      FP.tails.forEach((tl, i) => { tl.rotation.x = 0.25 + sp * 0.9 + Math.sin(t * 4 + i) * 0.12; tl.rotation.z = Math.sin(t * 2.2 + i * 2) * 0.1; });
      FP.head.rotation.z = Math.sin(t * 0.9) * 0.12;
      const pulse = 1 + Math.sin(t * 3.1) * 0.08 + Math.sin(t * 7.3) * 0.04;
      FP.halo.scale.setScalar(1.7 * pulse);
      FP.core.scale.setScalar(0.6 * (2 - pulse));
      FP.light.intensity = 3.6 * pulse;

      dustAcc += dt * (14 + sp * 40);
      while (dustAcc > 1) {
        dustAcc -= 1;
        const d = dust[dustNext], j = dustNext * 3;
        dustNext = (dustNext + 1) % DUST;
        d.life = 1;
        d.vx = (Math.random() - 0.5) * 0.4; d.vy = -0.25 - Math.random() * 0.4; d.vz = (Math.random() - 0.5) * 0.4;
        d.c = dustTint[(Math.random() * 3) | 0];
        dustPos[j] = fairy.position.x + (Math.random() - 0.5) * 0.25;
        dustPos[j + 1] = fairy.position.y + 0.1 + (Math.random() - 0.5) * 0.25;
        dustPos[j + 2] = fairy.position.z + (Math.random() - 0.5) * 0.25;
      }
      for (let i = 0; i < DUST; i++) {
        const d = dust[i], j = i * 3;
        if (d.life <= 0) { dustCol[j] = dustCol[j + 1] = dustCol[j + 2] = 0; continue; }
        d.life -= dt * 0.9;
        dustPos[j] += d.vx * dt; dustPos[j + 1] += d.vy * dt; dustPos[j + 2] += d.vz * dt;
        const a = Math.max(d.life, 0) * (0.6 + 0.4 * Math.sin(t * 20 + i));
        dustCol[j] = d.c.r * a; dustCol[j + 1] = d.c.g * a; dustCol[j + 2] = d.c.b * a;
      }
      dustGeo.attributes.position.needsUpdate = true;
      dustGeo.attributes.color.needsUpdate = true;
    }

    function updateCamera(dt) {
      const want = player.pos.clone(); want.y += 1.6;
      camTarget.lerp(want, 1 - Math.exp(-dt * 8));
      const cp = Math.cos(camPitch);
      const desired = new THREE.Vector3(
        camTarget.x + Math.sin(camYaw) * cp * camDist,
        camTarget.y + Math.sin(camPitch) * camDist,
        camTarget.z + Math.cos(camYaw) * cp * camDist);
      const minY = terrainHeight(desired.x, desired.z) + 1.2;
      if (desired.y < minY) desired.y = minY;
      camera.position.lerp(desired, 1 - Math.exp(-dt * 10));
      camera.lookAt(camTarget);
    }

    function updatePollen(t) {
      const a = pollenGeo.attributes.position, p = player.pos;
      for (let i = 0; i < POLLEN; i++) {
        const s = pollenSeed[i], j = i * 3;
        let x = pollenPos[j], z = pollenPos[j + 2];
        x += Math.sin(t * 0.3 + s) * 0.01 + 0.006; z += Math.cos(t * 0.25 + s * 1.3) * 0.01;
        if (x - p.x > 25) x -= 50; if (x - p.x < -25) x += 50;
        if (z - p.z > 25) z -= 50; if (z - p.z < -25) z += 50;
        pollenPos[j] = x; pollenPos[j + 2] = z;
        pollenPos[j + 1] = terrainHeight(x, z) + 0.6 + (Math.sin(t * 0.5 + s) * 0.5 + 0.5) * 3.5;
      }
      a.needsUpdate = true;
    }

    // ---------- 主迴圈 ----------
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      composer?.setSize(innerWidth, innerHeight);
      refl?.resize();
    });

    // NPC：呼吸、視線追蹤、玩家靠近時揮手、對話時轉身面對玩家；頭上提示泡泡投影到螢幕
    const _npcHead = new THREE.Vector3();
    function updateNPC(dt, t) {
      const dx = player.pos.x - npc.x, dz = player.pos.z - npc.z, d = Math.hypot(dx, dz);
      const toPlayer = Math.atan2(dx, dz);
      dlg.near = d < TALK_RANGE;
      if (dlg.open && d > TALK_RANGE + 1.5) dlgClose();
      // 身體朝向
      const wantYaw = dlg.open || d < TALK_RANGE ? toPlayer : npc.baseYaw;
      let dy = Math.atan2(Math.sin(wantYaw - npc.yaw), Math.cos(wantYaw - npc.yaw));
      npc.yaw += dy * Math.min(1, dt * 4);
      npc.root.rotation.y = npc.yaw;
      // 頭部看向玩家（限制角度）
      let hy = Math.atan2(Math.sin(toPlayer - npc.yaw), Math.cos(toPlayer - npc.yaw));
      hy = d < 9 ? THREE.MathUtils.clamp(hy, -1.0, 1.0) : 0;
      npc.head.rotation.y += (hy - npc.head.rotation.y) * Math.min(1, dt * 5);
      npc.head.rotation.z = Math.sin(t * 0.9) * 0.04 + (dlg.open ? Math.sin(t * 6) * 0.03 : 0);
      npc.body.position.y = Math.sin(t * 2) * 0.01;
      npc.body.scale.y = 1 + Math.sin(t * 2) * 0.006;
      // 揮手：玩家從遠處接近時
      const waving = !dlg.open && d > TALK_RANGE && d < 8;
      const wave = waving ? 1 : 0;
      npc.wave = (npc.wave || 0) + (wave - (npc.wave || 0)) * Math.min(1, dt * 5);
      const R = npc.arms[0];
      R.rotation.z = -0.12 - npc.wave * (2.4 + Math.sin(t * 9) * 0.35);
      R.rotation.x = -npc.wave * 0.3;
      npc.arms[1].rotation.z = 0.12 + (dlg.open ? Math.sin(t * 3) * 0.08 : 0);
      npc.arms[1].rotation.x = dlg.open ? -0.5 : 0;
      // 打字機效果
      if (dlg.open && dlg.shown < dlg.text.length) {
        dlg.shown = Math.min(dlg.text.length, dlg.shown + dt * 32);
        dlgLine.textContent = dlg.text.slice(0, Math.floor(dlg.shown));
        if (dlg.shown >= dlg.text.length) dlgEl.classList.add('done');
      } else if (dlg.open && !dlgEl.classList.contains('done')) {
        dlgLine.textContent = dlg.text; dlgEl.classList.add('done');
      }
      // 螢幕上的提示
      npc.head.getWorldPosition(_npcHead); _npcHead.y += 0.95;
      _npcHead.project(camera);
      const onScreen = _npcHead.z < 1 && Math.abs(_npcHead.x) < 1.1 && Math.abs(_npcHead.y) < 1.1;
      const sx = (_npcHead.x * 0.5 + 0.5) * innerWidth, sy = (-_npcHead.y * 0.5 + 0.5) * innerHeight;
      bubbleEl.textContent = dlg.talked ? '…' : '!';
      bubbleEl.classList.toggle('show', onScreen && !dlg.open && !dlg.near && d < 16);
      promptEl.classList.toggle('show', onScreen && !dlg.open && dlg.near);
      bubbleEl.style.left = promptEl.style.left = sx + 'px';
      bubbleEl.style.top = sy + 'px';
      promptEl.style.top = sy + 'px';
      promptEl.style.pointerEvents = dlg.near && !dlg.open ? 'auto' : 'none';
    }

    // 草地 LOD：依區塊距離換低段數草葉並降低密度（實例順序隨機，截斷 count 即均勻抽稀），遠處整塊不畫
    function updateGrassLOD() {
      const cp = camera.position;
      for (const g of grassChunks) {
        const d = Math.hypot(g.cx - cp.x, g.cz - cp.z);
        if (d > 95) { g.im.visible = false; continue; }
        g.im.visible = true;
        g.im.geometry = d < 22 ? bladeGeo : d < 50 ? bladeGeoLow : bladeGeoFar;
        g.im.count = Math.max(1, Math.floor(g.k * (1 - 0.7 * ss(18, 85, d))));
      }
    }

    // 解析度 LOD（動態解析度）：依實際影格時間調整 pixel ratio，畫面忙時降解析度、空閒時升回
    const dynRes = { max: renderer.getPixelRatio(), min: Math.min(1, renderer.getPixelRatio()), acc: 0, frames: 0, cool: 0 };
    function setPixelRatio(pr) {
      renderer.setPixelRatio(pr);
      renderer.setSize(innerWidth, innerHeight);
      if (composer) { composer.setPixelRatio(pr); composer.setSize(innerWidth, innerHeight); }
      refl?.resize();
    }
    function updateDynRes(dt) {
      dynRes.acc += dt; dynRes.frames++;
      if ((dynRes.cool -= dt) > 0 || dynRes.acc < 1) return;
      const avg = dynRes.acc / dynRes.frames, pr = renderer.getPixelRatio();
      dynRes.acc = 0; dynRes.frames = 0;
      let next = pr;
      if (avg > 1 / 48 && pr > dynRes.min) next = Math.max(dynRes.min, pr * Math.min(0.85, Math.sqrt((1 / 55) / avg)));
      else if (avg < 1 / 58 && pr < dynRes.max) next = Math.min(dynRes.max, pr + 0.15);
      if (Math.abs(next - pr) > 0.01) { setPixelRatio(next); dynRes.cool = 1.5; }
    }

    const lightRot = new THREE.Matrix4().lookAt(sunDir, new THREE.Vector3(), new THREE.Vector3(0, 1, 0));
    const lightInv = lightRot.clone().invert(), _snap = new THREE.Vector3();
    const SHADOW_TEXEL = SHADOW_HALF * 2 / sun.shadow.mapSize.x;
    const clock = new THREE.Clock();
    let pollenTick = 0;
    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
      U.time.value = t;
      waterMat.uniforms.uTime.value = t;
      updatePlayer(dt, t);
      updateNPC(dt, t);
      updateAttack(dt);
      updateTrail(t, atk.t >= 0.29 && atk.t <= 0.6);
      updateFairy(dt, t);
      updateCamera(dt);
      if (!LOW || (pollenTick++ & 1)) updatePollen(t);
      sky.position.copy(camera.position);
      skyMat.uniforms.uTime.value = t;
      if (gradePass) gradePass.uniforms.uTime.value = t;
      U.sunView.value.copy(sunDir).transformDirection(camera.matrixWorldInverse);
      // 陰影相機中心對齊 shadow-map 像素格，移動時陰影邊緣不再閃爍
      _snap.copy(player.pos).applyMatrix4(lightInv);
      _snap.x = Math.round(_snap.x / SHADOW_TEXEL) * SHADOW_TEXEL;
      _snap.y = Math.round(_snap.y / SHADOW_TEXEL) * SHADOW_TEXEL;
      _snap.applyMatrix4(lightRot);
      sun.target.position.copy(_snap);
      sun.position.copy(_snap).addScaledVector(sunDir, 150);
      updateGrassLOD();
      updateDynRes(dt);
      if (refl) renderReflection(camTarget);
      composer ? composer.render() : renderer.render(scene, camera);
    });

    const loading = document.getElementById('loading');
    loading.style.opacity = 0;
    setTimeout(() => loading.remove(), 900);
    setTimeout(() => { document.getElementById('banner').classList.add('hide'); document.getElementById('loc').classList.add('show'); }, 5200);
  </script>
